name: Verify debug artifact changes

on:
  push:
    branches: [codex/verify-debug-artifact-budget]

permissions:
  contents: read

jobs:
  debug-build:
    name: Debug build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup show active-toolchain
      - run: npm ci
      - run: npm run build
      - run: node scripts/clean-debug-artifacts.mjs
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features server,tauri/custom-protocol --bins
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features server
