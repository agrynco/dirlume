name: CI and releases

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    dirlume-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
    (github.event.action == 'closed' && github.event.pull_request.merged && github.head_ref == 'prerelease' &&
    github.event.pull_request.head.repo.full_name == github.repository)) && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  version:
    name: Resolve build version
    if: >-
      github.event.action != 'closed' ||
      (github.event.pull_request.merged && github.head_ref == 'prerelease' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    outputs:
      product-version: ${{ steps.resolve.outputs.product-version }}
      build-number: ${{ steps.resolve.outputs.build-number }}
      publish: ${{ steps.resolve.outputs.publish }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether a stable release already includes this merge
        if: github.event.action == 'closed'
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_SHA" != "$MERGED_SHA" ]]; then
            echo 'The release must build the merged pull request commit.' >&2
            exit 1
          fi
          refs=$(git ls-remote --tags origin 'v*')
          tags=$(awk -v sha="$GITHUB_SHA" '$1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' <<< "$refs")
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if [[ -n "$tags" ]] && grep -Fxq -f <(printf '%s\n' "$tags") <<< "$published"; then
            echo 'This merge already has a stable release.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' <<< "$published" | sort -Vr | sed -n '1p')
          if [[ -z "$latest" ]]; then exit 0; fi
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$latest" --jq .status)
          if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
            echo 'The latest stable release already includes this merge.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.published.outputs.skip != 'true'
        with:
          node-version: '24'
      - run: node --test scripts/build-version.test.mjs scripts/package.test.mjs
        if: github.event.action != 'closed'
      - name: Resolve product version and build number
        if: steps.published.outputs.skip != 'true'
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'closed' }}
          CHECK_NEXT_RELEASE_HIGHLIGHTS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'prerelease' }}
        run: node scripts/build-version.mjs resolve
      - name: Select build platforms
        if: steps.resolve.outputs.product-version != ''
        id: platforms
        run: |
          platforms="$(node scripts/package.mjs platforms)"
          printf 'platforms=%s\n' "$platforms" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.platform }})
    if: needs.version.outputs.product-version != ''
    needs: version
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2025","linux-x64":"ubuntu-22.04","macos-arm64":"macos-15","macos-x64":"macos-15-intel"}')[matrix.platform] }}
    timeout-minutes: ${{ matrix.platform == 'macos-x64' && 60 || 45 }}
    env:
      DIRLUME_PRODUCT_VERSION: ${{ needs.version.outputs.product-version }}
      DIRLUME_BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      DIRLUME_SIGNED_RELEASE: ${{ needs.version.outputs.publish }}
      DIRLUME_BUNDLES: ${{ fromJSON('{"windows-x64":"nsis","linux-x64":"deb,appimage","macos-arm64":"app,dmg","macos-x64":"app,dmg"}')[matrix.platform] }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.version.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf zip
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
      - name: Apply the resolved version to the manifests
        run: node scripts/build-version.mjs prepare
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify editor line endings and workspace resource ownership
        if: github.event.action != 'closed'
        run: node --test scripts/text-format.test.mjs scripts/workspace-resources.test.mjs
      - name: Check package and release versions
        run: node scripts/package.mjs check
      - name: Build and type-check React
        if: github.event.action != 'closed'
        run: npm run build
      - name: Verify packaged JavaScript error locations
        if: github.event.action != 'closed'
        run: node scripts/frontend-diagnostics-smoke.mjs
      - name: Verify startup and manual update checks
        if: github.event.action != 'closed'
        run: node scripts/update-check-smoke.mjs
      - name: Verify editable dropdowns in light and dark themes
        if: github.event.action != 'closed'
        run: node scripts/editable-dropdown-smoke.mjs
      - name: Verify selective settings import and export
        if: github.event.action != 'closed'
        run: node scripts/settings-archive-smoke.mjs
      - name: Verify settings profiles
        if: github.event.action != 'closed'
        run: node scripts/settings-profiles-smoke.mjs
      - name: Verify the optional status bar
        if: github.event.action != 'closed'
        run: node scripts/status-bar-smoke.mjs
      - name: Verify clearing the error log from the viewer
        if: github.event.action != 'closed'
        run: node scripts/diagnostic-log-smoke.mjs
      - name: Verify terminal directory synchronization
        if: github.event.action != 'closed'
        run: node scripts/terminal-directory-smoke.mjs
      - name: Verify terminal web links
        if: github.event.action != 'closed'
        run: node scripts/terminal-links-smoke.mjs
      - name: Verify transfer estimates
        if: github.event.action != 'closed'
        run: node scripts/transfer-estimate-smoke.mjs
      - name: Verify current marked row colors and keyboard navigation
        if: github.event.action != 'closed'
        run: node scripts/marked-cursor-smoke.mjs
      - name: Verify right-click selection and held context menus
        if: github.event.action != 'closed'
        run: node scripts/right-click-selection-smoke.mjs
      - name: Verify independent text surface appearance
        if: github.event.action != 'closed'
        run: node scripts/text-appearance-smoke.mjs
      - name: Verify whitespace and shared tab stops in text documents
        if: github.event.action != 'closed'
        run: node scripts/text-whitespace-smoke.mjs
      - name: Verify Quick View in both panes
        if: github.event.action != 'closed'
        run: node scripts/quick-view-smoke.mjs
      - name: Verify continuous scrolling in Hex Viewer
        if: github.event.action != 'closed'
        run: node scripts/hex-scroll-smoke.mjs
      - name: Verify Mermaid diagram zoom and separate viewer
        if: github.event.action != 'closed'
        run: node scripts/mermaid-zoom-smoke.mjs
      - name: Verify main menu visibility and shortcuts
        if: github.event.action != 'closed'
        run: node scripts/menu-header-smoke.mjs
      - name: Verify the About and title-bar donation buttons
        if: github.event.action != 'closed'
        run: node scripts/about-donation-smoke.mjs
      - name: Verify contextual offline Help
        if: github.event.action != 'closed'
        run: node scripts/contextual-help-smoke.mjs
      - name: Verify local Viewer file bookmarks
        if: github.event.action != 'closed'
        run: node scripts/file-bookmarks-smoke.mjs
      - name: Verify command line paths from parent and file rows
        if: github.event.action != 'closed'
        run: node scripts/command-parent-path-smoke.mjs
      - name: Verify SSH pane refresh after uploads and with shortcuts
        if: github.event.action != 'closed'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --target .smoke/sftp-test-deps paramiko==5.1.0
          PYTHONPATH=.smoke/sftp-test-deps DIRLUME_SFTP_TEST_PYTHON=python node scripts/ssh-refresh-smoke.mjs
      - name: Verify SSH and SFTP jump host editing
        if: github.event.action != 'closed'
        run: node scripts/ssh-jump-dialog-smoke.mjs
      - name: Verify remote connection breadcrumbs and history
        # The browser fixture simulates all three platforms on each host.
        if: github.event.action != 'closed' && runner.os != 'macOS'
        run: node scripts/connection-breadcrumbs-smoke.mjs
      - name: Verify file pane stability when the window regains focus
        if: github.event.action != 'closed'
        run: node scripts/pane-focus-smoke.mjs
      - name: Verify Space Analyzer controls and provider scopes
        if: github.event.action != 'closed'
        run: node scripts/space-analyzer-smoke.mjs
      - name: Verify administrator window workspace handoff
        if: github.event.action != 'closed'
        run: node scripts/administrator-workspace-smoke.mjs
      - name: Verify local file pane Tree and folder sizing
        if: github.event.action != 'closed'
        run: node scripts/file-pane-tree-smoke.mjs
      - name: Verify automatic file pane column widths
        if: github.event.action != 'closed'
        run: node scripts/pane-column-sizing-smoke.mjs
      - name: Verify local Search results actions and refresh
        if: github.event.action != 'closed'
        run: node scripts/search-results-smoke.mjs
      - name: Verify Git View
        if: github.event.action != 'closed'
        run: node scripts/git-view-smoke.mjs
      - name: Verify environment variable panes and copy review
        if: github.event.action != 'closed'
        run: node scripts/environment-panes-smoke.mjs
      - name: Verify process context menu actions and identity
        if: github.event.action != 'closed'
        run: node scripts/process-context-menu-smoke.mjs
      - name: Verify workspace source and folder bookmark shortcuts
        if: github.event.action != 'closed'
        run: node scripts/workspace-source-shortcuts-smoke.mjs
      - name: Verify recent folder history and provider reconnection
        if: github.event.action != 'closed'
        run: node scripts/recent-locations-smoke.mjs
      - name: Check Rust format
        if: github.event.action != 'closed'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Lint Rust desktop and server
        if: github.event.action != 'closed'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features server -- -D warnings
      - name: Prepare the bundled 7-Zip engine
        shell: pwsh
        run: ./scripts/prepare-7zip.ps1
      - name: Verify filesystem and server
        if: github.event.action != 'closed'
        env:
          DIRLUME_VERIFY_ARCHIVES: '1'
          DIRLUME_VERIFY_FILE_OPEN: ${{ runner.os != 'Linux' && '1' || '' }}
          DIRLUME_SSH_FIXTURE_PYTHON: python
          PYTHONPATH: ${{ github.workspace }}/.smoke/sftp-test-deps
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features server
      - name: Bundle desktop app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.version.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.version.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          $configArgs = @()
          if ($env:DIRLUME_SIGNED_RELEASE -eq 'true') {
            node scripts/package.mjs configure-signing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $configArgs = @('--config', 'src-tauri/target/updater-config.json')
          }
          npm run tauri -- build --ci --bundles "$env:DIRLUME_BUNDLES" @configArgs -- --locked
          exit $LASTEXITCODE
      - name: Retain build-matched JavaScript source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-maps-${{ needs.version.outputs.product-version }}-build.${{ needs.version.outputs.build-number }}-${{ matrix.platform }}
          path: src-tauri/target/frontend-sourcemaps/*.js.map
          if-no-files-found: error
          overwrite: true
      - name: Build headless server
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --features server --bin dirlume-server
      - name: Test two-process TLS access
        if: github.event.action != 'closed'
        run: node scripts/server-smoke.mjs
      - name: Prepare Windows WebView2 runtime
        if: runner.os == 'Windows' && github.event.action != 'closed'
        shell: pwsh
        run: ./scripts/ensure-webview.ps1
      - name: Build Windows UI automation fixture
        if: runner.os == 'Windows' && github.event.action != 'closed'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features server,ui-automation,tauri/custom-protocol
      - name: Install FTP smoke fixture dependency
        if: runner.os == 'Windows' && github.event.action != 'closed'
        run: python -m pip install pyftpdlib==2.2.0
      - name: Test Windows desktop application
        if: runner.os == 'Windows' && github.event.action != 'closed'
        env:
          DIRLUME_BUILD_PROFILE: debug
          DIRLUME_INTERNAL_CDP: '1'
          DIRLUME_FTP_PYTHON: python
          DIRLUME_SSH_FIXTURE_PYTHON: python
          DIRLUME_VERIFY_ARCHIVES: '1'
          PYTHONPATH: ${{ github.workspace }}/.smoke/sftp-test-deps
        run: node scripts/desktop-smoke.mjs
      - name: Package artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os == 'Windows' && needs.version.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ runner.os == 'Windows' && needs.version.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node scripts/package.mjs collect "${{ matrix.platform }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dirlume-${{ needs.version.outputs.product-version }}-build.${{ needs.version.outputs.build-number }}-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub release
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DIRLUME_PRODUCT_VERSION: ${{ needs.version.outputs.product-version }}
      DIRLUME_BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      TAG: v${{ needs.version.outputs.product-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dirlume-${{ needs.version.outputs.product-version }}-build.${{ needs.version.outputs.build-number }}-*
          path: release
          merge-multiple: true
      - name: Publish checked packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(node scripts/package.mjs verify-release)"
          (cd release && sha256sum --check --strict ./*.sha256)
          node scripts/build-version.mjs check-release
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
            if ! gh api "$tag_ref" --silent; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
            fi
          fi
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "The release tag does not point to the built commit." >&2
            exit 1
          fi
          options=()
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$notes" --title "Dirlume $TAG" "${options[@]}" release/*
