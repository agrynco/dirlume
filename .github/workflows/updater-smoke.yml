name: Verify repeated Copy and Move dialogs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          node scripts/transfer-estimate-smoke.mjs
          node scripts/transfer-estimate-smoke.mjs
