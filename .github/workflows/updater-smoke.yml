name: Verify the Windows desktop smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      DIRLUME_BUILD_PROFILE: debug
      DIRLUME_INTERNAL_CDP: '1'
      DIRLUME_FTP_PYTHON: python
      DIRLUME_SSH_FIXTURE_PYTHON: python
      DIRLUME_VERIFY_ARCHIVES: '1'
      PYTHONPATH: ${{ github.workspace }}/.smoke/sftp-test-deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ./scripts/ensure-webview.ps1
        shell: pwsh
      - run: python -m pip install pyftpdlib==2.2.0
      - run: python -m pip install --disable-pip-version-check --target .smoke/sftp-test-deps paramiko==5.1.0
      - uses: actions/cache/restore@v4
        id: desktop-binaries
        with:
          path: |
            src-tauri/target/debug/dirlume.exe
            src-tauri/target/debug/archive-tools
            src-tauri/target/debug/dirlume-server.exe
          key: dirlume-win-debug-smoke-c7dd2df9c7af0f13d447804637186db26ab54135
      - if: steps.desktop-binaries.outputs.cache-hit != 'true'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features server,ui-automation,tauri/custom-protocol
      - uses: actions/cache/save@v4
        if: steps.desktop-binaries.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/target/debug/dirlume.exe
            src-tauri/target/debug/archive-tools
            src-tauri/target/debug/dirlume-server.exe
          key: dirlume-win-debug-smoke-c7dd2df9c7af0f13d447804637186db26ab54135
      - run: node scripts/desktop-smoke.mjs
