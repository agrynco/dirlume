[package]
name = "dirlume"
version = "0.1.0"
description = "Two-pane desktop file manager"
license = "MIT"
edition = "2021"
rust-version = "1.100"
default-run = "dirlume"

[[bin]]
name = "dirlume"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "dirlume-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["desktop"]
desktop = ["dep:axum", "dep:axum-server", "dep:block2", "dep:cap-std", "dep:ciborium", "dep:clipboard-rs", "dep:codepage", "dep:encoding_rs", "dep:font-kit", "dep:gio", "dep:image", "dep:junction", "dep:keyring", "dep:libc", "dep:notify", "dep:ntfs-mft", "dep:objc2-app-kit", "dep:png", "dep:portable-pty", "dep:rcgen", "dep:reqwest", "dep:ring", "dep:rustls", "dep:semver", "dep:subtle", "dep:suppaftp", "dep:sysinfo", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tokio", "dep:tokio-util", "dep:uuid", "dep:windows", "dep:futures-util", "dep:openssh-sftp-client", "dep:russh", "dep:x11rb", "dep:zbus", "dep:zeroize", "dep:zip"]
ui-automation = ["desktop", "tauri/devtools"]
server = ["dep:axum", "dep:axum-server", "dep:cap-std", "dep:clap", "dep:rcgen", "dep:ring", "dep:subtle", "dep:tokio", "dep:tokio-util"]

[lib]
name = "dirlume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", optional = true }
axum-server = { version = "0.9", features = ["tls-rustls-ring"], optional = true }
base64 = "0.22"
cap-std = { version = "4", optional = true }
ciborium = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
clipboard-rs = { version = "0.3", default-features = false, features = ["wayland"], optional = true }
codepage = { version = "0.1", optional = true }
dirs = "6"
encoding_rs = { version = "0.8", optional = true }
font-kit = { version = "0.14", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
notify = { version = "8.2", optional = true }
open = "5"
openssh-sftp-client = { version = "0.15", optional = true }
portable-pty = { version = "0.9", optional = true }
rcgen = { version = "0.14", optional = true }
renamest = "0.1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
ring = { version = "0.17", optional = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
same-file = "1"
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = { version = "2", optional = true }
suppaftp = { version = "13", optional = true }
sysinfo = { version = "0.40", default-features = false, features = ["system"], optional = true }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.14.1", optional = true }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"], optional = true }
tokio-util = { version = "0.7", features = ["io", "rt"], optional = true }
trash = "5"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"], optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.18", optional = true }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"], optional = true }
x11rb = { version = "0.13", optional = true }
zbus = { version = "4.4", default-features = false, features = ["tokio"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
keyring = { version = "3.6", features = ["apple-native"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSampler", "NSColorSpace", "block2", "objc2-core-foundation"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
junction = { version = "2.1", optional = true }
keyring = { version = "3.6", features = ["windows-native"], optional = true }
png = { version = "0.18", optional = true }
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WNet", "Win32_System_Com", "Win32_System_RestartManager", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"], optional = true }
ntfs-mft = { version = "0.1.0", optional = true }
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Globalization", "Win32_NetworkManagement_NetManagement", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time"] }
