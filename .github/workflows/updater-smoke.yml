name: Install signed desktop updates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirlume-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Verify installed update (${{ matrix.runner }})
    runs-on: ${{ github.event.repository.private && vars.DIRLUME_SELF_HOSTED == 'true' && matrix.self-hosted || matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            self-hosted: dirlume-windows-x64
          - runner: ubuntu-22.04
            self-hosted: dirlume-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf \
            xvfb openbox x11-utils dbus-x11
      - name: Prepare Windows WebView2 runtime
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: ./scripts/ensure-webview.ps1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: updater-cargo-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Test install, signature rejection, saved preferences, and release highlights
        env:
          DIRLUME_TEST_DEBIAN_UPGRADE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node scripts/updater-smoke.mjs
