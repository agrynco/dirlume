[package]
name = "dirlume"
version = "0.1.0"
description = "Two-pane desktop file manager"
license = "MIT"
edition = "2021"
rust-version = "1.100"
default-run = "dirlume"

[[bin]]
name = "dirlume"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "dirlume-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["desktop"]
desktop = ["dep:font-kit", "dep:notify", "dep:portable-pty", "dep:reqwest", "dep:tauri"]
ui-automation = ["desktop", "tauri/devtools"]
server = ["dep:axum", "dep:axum-server", "dep:cap-std", "dep:clap", "dep:rcgen", "dep:ring", "dep:subtle", "dep:tokio", "dep:tokio-util"]

[lib]
name = "dirlume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", optional = true }
axum-server = { version = "0.9", features = ["tls-rustls-ring"], optional = true }
base64 = "0.22"
cap-std = { version = "4", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
dirs = "6"
font-kit = { version = "0.14", optional = true }
notify = { version = "8.2", optional = true }
open = "5"
portable-pty = { version = "0.9", optional = true }
rcgen = { version = "0.14", optional = true }
renamest = "0.1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
ring = { version = "0.17", optional = true }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = { version = "2", optional = true }
tauri = { version = "2", optional = true , features = [] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
trash = "5"
url = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }
