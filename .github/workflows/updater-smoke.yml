name: Verify native file operation history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native filesystem history
        shell: bash
        env:
          DIRLUME_HISTORY_TRASH_FIXTURE: '1'
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Dirlume history fixture</title>' > dist/index.html
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib file_history
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib undo_copy_trashes_the_copy_and_redo_recreates_it -- --ignored
