name: Verify native User Menu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  user-menu:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify folder menu and shell behavior
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Dirlume menu fixture</title>' > dist/index.html
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib user_menu
